name: Android CI & GitHub Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-grind-calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: releases/RELEASE_NOTES_v2.0.0.md
          files: |
            releases/coffee-grind-calculator-v2.0-release.apk
            releases/coffee-grind-calculator-v2.0-release.aab
            releases/SHA256SUMS.txt
